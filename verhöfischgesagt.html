
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hofstil Transmutator – Verhöfisch Gesagt</title>
    <style>
        :root {
            --bg-color: #121016;
            --card-bg: #1c1822;
            --gold: #d4af37;
            --text: #e0d8f0;
            --accent: #8a2be2;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        h1 {
            color: var(--gold);
            text-align: center;
            margin-top: 0;
            font-weight: normal;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 15px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--gold);
            font-size: 0.9em;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid #443c52;
            border-radius: 6px;
            color: var(--text);
            padding: 12px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--gold);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        select, button {
            background-color: var(--card-bg);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px 18px;
            font-family: inherit;
            font-size: 0.95em;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button {
            background-color: var(--gold);
            color: var(--bg-color);
            font-weight: bold;
            flex-grow: 1;
        }

        button:hover {
            background-color: #f1c40f;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .output-box {
            background-color: rgba(0, 0, 0, 0.6);
            border-left: 4px solid var(--gold);
            padding: 15px;
            border-radius: 0 6px 6px 0;
            min-height: 80px;
            white-space: pre-wrap;
            font-style: italic;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hofstil Transmutator</h1>
    
    <div class="input-group">
        <label for="inputText">Ihr Anliegen in gewöhnlicher Rede:</label>
        <textarea id="inputText" placeholder="Geben Sie hier Ihren Text ein, z.B.: Hallo, wie geht es dir? Ich habe eine Frage."></textarea>
    </div>

    <div class="controls">
        <select id="styleSelect">
            <option value="barock">Höfisches Barock</option>
            <option value="kanzlei">Kaiserlicher Kanzleistil</option>
            <option value="poetisch">Romantisch-Poetisch</option>
        </select>
        <button onclick="transmuteText()">Verhöfischen</button>
    </div>

    <div class="input-group">
        <label>Verhöfischte Kundgabe:</label>
        <div id="outputText" class="output-box">Warten auf Eure Einbegehrung...</div>
    </div>
</div>

<script>
const dictionary = {
    barock: {
        prefix: "Seid gegrüßt, edler Herr / werte Dame!\n\nEs gereicht Uns zur außerordentlichen Ergötzlichkeit, Euch kundzutun:\n",
        suffix: "\n\nIn tiefster Ergebenheit verbleibend,",
        replacements: [
            [/hallo|hi|guten tag/gi, "Seyed gegrüßet"],
            [/wie geht es dir|wie gehts/gi, "wie stehet es um Euer wohlgeschätztes Befinden"],
            [/ich habe eine frage/gi, "ein dringlich Begehren drängt an Unser Ohr"],
            [/danke/gi, "Wir erweisen Euch Unseren verbindlichsten Dank"],
            [/ja/gi, "Wohlan, so sei es"],
            [/nein/gi, "Behüte uns Gott vor solchem Tuen"],
            [/tschüss|ciao|auf wiedersehen/gi, "Gott befehle Euch in seine gnädige Obhut"],
            [/geld/gi, "Güter und Dukaten"],
            [/arbeiten|arbeite/gi, "dem schaffenden Tagewerk nachgehen"],
            [/heute/gi, "am heutigen Tage des Herrn"],
            [/schnell/gi, "ohne Verzug und mit größter Eile"],
            [/problem/gi, "Mißhelligkeit"]
        ]
    },
    kanzlei: {
        prefix: "Kund und zu wissen sei hiermit jedermann:\n\nIn Sachen der nachfolgenden Angelegenheit wird ordnungsgemäß vermerkt:\n",
        suffix: "\n\nSignatum und siegelbewährt unter kaiserlicher Verordnung.",
        replacements: [
            [/hallo|guten tag/gi, "Zu wissen sei"],
            [/frage/gi, "eingereichter Petition"],
            [/danke/gi, "in getreuer Anerkenntnis"],
            [/geld/gi, "Münzbestand"],
            [/schnell/gi, "unverzüglich"],
            [/problem/gi, "unvorhergesehene Hemmnis"]
        ]
    },
    poetisch: {
        prefix: "Wie ein Hauch von Gold verströmt diese Kunde:\n\n",
        suffix: "\n\nSo verweht der Ruf durch den Garten der Zeit.",
        replacements: [
            [/hallo/gi, "Sei uns willkommen wie der Lenz"],
            [/danke/gi, "Mein Herz neigt sich in Dankbarkeit"],
            [/nacht/gi, "samtene Schattenstunde"],
            [/sonne/gi, "das goldene Tagesgestirn"]
        ]
    }
};

function transmuteText() {
    const input = document.getElementById('inputText').value;
    const style = document.getElementById('styleSelect').value;
    const outputBox = document.getElementById('outputText');

    if (!input.trim()) {
        outputBox.innerText = "So sprecht doch, damit Wir Euch vernehmen können!";
        return;
    }

    let config = dictionary[style];
    let result = input;

    // Ersetzungen durchführen
    config.replacements.forEach(([pattern, replacement]) => {
        result = result.replace(pattern, replacement);
    });

    // Ihr/Euch Anrede anpassen (einfache Heuristik)
    result = result.replace(/\bdu\b/gi, "Ihr");
    result = result.replace(/\bdir\b/gi, "Euch");
    result = result.replace(/\bdein\b/gi, "Euer");
    result = result.replace(/\bdeine\b/gi, "Eure");
    result = result.replace(/\bdeinen\b/gi, "Euren");

    outputBox.innerText = config.prefix + result + config.suffix;
}
</script>

</body>
</html>
